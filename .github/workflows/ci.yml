name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nginx: [1.22.1, 1.24.0, 1.26.3, 1.28.3, 1.30.7, 1.31.9]
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev zlib1g-dev
      - name: Build nginx ${{ matrix.nginx }} with the module
        run: ./build.sh ${{ matrix.nginx }} --with-debug
      - name: Integration tests
        run: python3 tests/run_tests.py build/nginx-${{ matrix.nginx }}/objs/nginx
